<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verl Adams</title>
<meta name="description" content="Photography by Verl Adams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<header>
  <a class="name" href="#/">VERL ADAMS</a>
  <nav id="tabs" aria-label="Galleries"></nav>
</header>

<main>
  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="status" class="status"></p>
</main>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" aria-label="Close">&times;</button>
  <div class="lb-stage" id="lb-stage">
    <button class="lb-arrow lb-prev" aria-label="Previous photo">&#8249;</button>
    <div id="lb-scroll" class="lb-scroll">
      <header>
        <a class="name" href="#/">VERL ADAMS</a>
        <nav id="lb-tabs" aria-label="Galleries"></nav>
      </header>
      <figure id="lb-fig" class="lb-fig">
        <div id="lb-photo" class="lb-photo" title="Next photo">
          <img id="lb-img" alt="">
        </div>
        <figcaption id="lb-cap" class="lb-cap"></figcaption>
      </figure>
    </div>
    <button class="lb-arrow lb-next" aria-label="Next photo">&#8250;</button>
  </div>
</div>

<script src="config.js?v=16"></script>
<script src="app.js?v=16"></script>
</body>
</html>
